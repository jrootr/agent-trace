name: Release

# Publishes a version: GitHub release (with the standalone viewer attached) + npm.
# npm uses trusted publishing (OIDC): no token is stored anywhere. The package's
# npm settings trust this repository and this workflow file (release.yml).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.2.1
        required: true

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (11.5.1+)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json version $v"; exit 1; fi
      - name: Build, lint, test
        run: npm run check
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-tools.mjs notes "${TAG#v}" > notes.md
      - name: GitHub release with the standalone viewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" dist/agent-trace.html --title "agent-trace $TAG" --notes-file notes.md --verify-tag
          fi
      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "$name@$v is already on npm; nothing to publish"
          else
            npm publish --access public --provenance
          fi
