<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="agent-trace logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="0.55" stop-color="#5b4ff5"/>
      <stop offset="1" stop-color="#3b2fc9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>
  <!-- the trace: three lanes of activity, staggered like a timeline -->
  <rect x="22" y="33" width="44" height="13" rx="6.5" fill="#fff"/>
  <rect x="40" y="58" width="66" height="13" rx="6.5" fill="#fff" fill-opacity="0.78"/>
  <rect x="28" y="83" width="30" height="13" rx="6.5" fill="#fff" fill-opacity="0.55"/>
  <rect x="64" y="83" width="18" height="13" rx="6.5" fill="#fff" fill-opacity="0.55"/>
  <!-- the dotted thread connecting them: the agent's path -->
  <path d="M66 39.5 H78 Q84 39.5 84 45.5 V58" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 6"/>
  <!-- a "moment": the point where the agent changed course -->
  <path d="M92 26 L102 36 L92 46 L82 36 Z" fill="url(#moment)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
